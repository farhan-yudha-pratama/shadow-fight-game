# ==============================================================
# Docker Compose - Local Testing (Zero Build / Siap Pakai)
# ==============================================================

services:
  duel-bayangan:
    image: node:24-alpine
    container_name: duel-bayangan-local
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0 # WAJIB 0.0.0.0 agar bisa diakses dari browser luar container
    volumes:
      - ./:/app # Mount seluruh folder kerja (live-reload aktif)
    command: sh -c "npm install && node --watch server/index.js"
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
