<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Duel Bayangan - Multiplayer Fighting Game</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Teko:wght@500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/main.css?v=2.4.3">
</head>
<body>
  <div class="wrap">
    <!-- Top System Error Banner -->
    <div id="errBanner" class="err-banner" hidden></div>

    <!-- Top Header -->
    <header class="top">
      <div class="brand">
        <h1 class="game-title">Duel Bayangan</h1>
        <span class="tag" id="lvl">Lawan 1</span>
      </div>
      <div class="topr">
        <span class="ping-badge" id="pingBadge" hidden><span class="ping-dot"></span><span id="pingVal">--ms</span></span>
        <button class="icon-btn" id="mute" type="button" aria-label="Pengaturan Suara" title="Pengaturan Suara">
          <svg class="icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
          <svg class="icon-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
        </button>
        <button class="icon-btn" id="menuBtn" type="button" aria-label="Menu" title="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Fighting HUD: Health bars, timer, round pips -->
    <div class="hud" role="region" aria-label="Status Pertarungan">
      <div class="bar left">
        <div class="label">
          <span id="pName">Kamu</span>
          <span class="pips" id="pPips" aria-label="Kemenangan Ronde Kamu">
            <i class="pip"></i><i class="pip"></i>
          </span>
        </div>
        <div class="track"><i class="trail" id="pTrail"></i><i class="fill" id="pFill"></i></div>
      </div>
      
      <div class="clock" id="clock" aria-label="Waktu Ronde Tersisa">60</div>
      
      <div class="bar right">
        <div class="label">
          <span id="eName">Bayangan Muda</span>
          <span class="pips" id="ePips" aria-label="Kemenangan Ronde Lawan">
            <i class="pip"></i><i class="pip"></i>
          </span>
        </div>
        <div class="track"><i class="trail" id="eTrail"></i><i class="fill" id="eFill"></i></div>
      </div>
    </div>

    <!-- Arena Stage & Canvas -->
    <div class="stage" id="stage">
      <canvas id="c" role="img" aria-label="Arena duel dua petarung bayangan"></canvas>
      <div class="combo" id="combo" hidden></div>
      <div class="banner" id="banner" hidden><span></span></div>

      <!-- Real-Time Lockstep Diagnostics HUD -->
      <div id="netDiag" class="net-diag" hidden>
        <div class="diag-line"><span id="diagSync" class="diag-tag tag-ok">SYNCED</span> <span class="diag-sep">|</span> F:<b id="diagLocalF">0</b> RF:<b id="diagRemoteF">0</b></div>
        <div class="diag-line">Buf:<b id="diagBuf">0</b> <span class="diag-sep">|</span> Ping:<b id="diagPing">--</b>ms</div>
      </div>
      
      <!-- Overlay modal panels -->
      <div class="over" id="over"><div class="panel" id="panel"></div></div>
      <div class="over" id="menu" hidden><div class="panel" id="mpanel"></div></div>
      <div class="over" id="fsPrompt" hidden>
        <div class="panel">
          <h2>Layar Penuh</h2>
          <p>Aktifkan mode fullscreen untuk kenyamanan kontrol dan pandangan arena maksimal?</p>
          <div class="row">
            <button class="btn" type="button" id="btnFsOk">Aktifkan</button>
            <button class="ghost" type="button" id="btnFsNo">Nanti Saja</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Virtual Pad for Touch Devices -->
    <div class="pad" id="pad">
      <div class="joy" id="joy" aria-label="Joystick sentuh virtual">
        <i id="knob"></i>
      </div>
      <div class="cr">
        <button type="button" data-k="block" aria-label="Blok">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l7 3v5c0 5-3 8.5-7 10-4-1.5-7-5-7-10V6z"/>
          </svg>
        </button>
        <button type="button" data-k="punch" aria-label="Pukul">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 10.5A2.5 2.5 0 0 1 8.5 8h8a2.5 2.5 0 0 1 2.5 2.5V16a4 4 0 0 1-4 4h-5a4 4 0 0 1-4-4z"/>
            <path d="M10.7 8v4.5M14.8 8v4.5M6 13.5h4.7"/>
          </svg>
        </button>
        <button type="button" data-k="kick" aria-label="Tendang">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3h5v8l6 3a1.5 1.5 0 0 1 1 1.4V18a1.5 1.5 0 0 1-1.5 1.5H8a1 1 0 0 1-1-1z"/>
            <path d="M7 16.5h13"/>
          </svg>
        </button>
      </div>
    </div>
    
    <p class="hint">A/D gerak · W lompat · S tahan untuk blok · J pukul · K tendang</p>
  </div>

  <!-- Entry Script (ES Module) -->
  <script type="module" src="js/main.js?v=2.4.3"></script>
</body>
</html>
